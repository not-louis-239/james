[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "james"
version = "0.1.0"
description = "pygame ui library"
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "Louis Masarei-Boulton" }]
dependencies = [
    "pygame>=2.6.1"
]

[tool.setuptools]
package-dir = {"" = "src"}
